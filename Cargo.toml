[package]
name = "pulp"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A fast, native PDF toolkit for the terminal"
license = "MIT"
keywords = ["pdf", "cli", "tui"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
lopdf = "0.45"
ratatui = { version = "0.30", features = ["crossterm"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true